zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 8e155e663e5c4a3f93a765d6c30b70cd
      template: 'Proxmox Backup Server by HTTP'
      name: 'Proxmox Backup Server by HTTP'
      description: |
        Template for monitoring Proxmox Backup Server (PBS) via its HTTP API.

        It collects datastore usage, disk health and wearout, failed task
        information and per-backup-group snapshot freshness through the PBS REST
        API, and discovers datastores, disks and backup groups via low-level
        discovery.

        Setup:
        Create a monitoring user and an API token with at least the "Audit" role
        on path "/", then set the {$PBS.HOST}, {$PBS.TOKEN.ID} and
        {$PBS.TOKEN.SECRET} macros on the host.

        API documentation: https://pbs.proxmox.com/docs/api-viewer/index.html

        Template author: nikosch86
        Source and issue tracker: https://github.com/nikosch86/zabbix-proxmox-backup-server
      groups:
        - name: Templates/Applications
      items:
        - uuid: 0449b6e2a6ae4e40860479b234035718
          name: 'PBS: API service status'
          type: SCRIPT
          key: pbs.api.available
          delay: 5m
          history: 7d
          params: |
            try {
              var params = JSON.parse(value);
              var req = new HttpRequest();
              req.addHeader('Authorization: PBSAPIToken=' + params.token + ':' + params.secret);
              req.get(encodeURI('https://' + params.host + ':' + params.port + '/api2/json/version'));
            } catch (error) {
                Zabbix.log(3, "Proxmox Backup Server API failed: " + params.host + " Error: " + error);
                if (!Number.isInteger(error))
                    return 520;
            }
            return req.getStatus();
          description: 'Get API service status.'
          valuemap:
            name: 'HTTP response status code'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          timeout: 10s
          parameters:
            - name: host
              value: '{$PBS.HOST}'
            - name: port
              value: '{$PBS.PORT}'
            - name: secret
              value: '{$PBS.TOKEN.SECRET}'
            - name: token
              value: '{$PBS.TOKEN.ID}'
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: c824c9e2069b4566b4c0d41d5ae7266e
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
              name: 'PBS: API service not available'
              priority: HIGH
              description: 'The API service is not available. Check the network connection, the PBS service status and the API token authorization settings.'
        - uuid: ddea6e9d77c04fedb237d1bf72d22778
          name: 'PBS: Get datastore status'
          type: HTTP_AGENT
          key: pbs.datastore.status
          delay: 5m
          history: 7d
          value_type: TEXT
          description: 'Get datastore status.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'Error getting data'
            - type: JSONPATH
              parameters:
                - $.body.data
          timeout: 10s
          url: 'https://{$PBS.HOST}:{$PBS.PORT}/api2/json/status/datastore-usage'
          headers:
            - name: Authorization
              value: 'PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}'
          output_format: JSON
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: raw
        - uuid: 83c76592aedf4833a63393b5e7b54fb9
          name: 'PBS: Get disks'
          type: HTTP_AGENT
          key: pbs.disks
          delay: 5m
          history: 7d
          value_type: TEXT
          description: 'Get disks.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'Error getting data'
            - type: JSONPATH
              parameters:
                - $.body.data
          timeout: 10s
          url: 'https://{$PBS.HOST}:{$PBS.PORT}/api2/json/nodes/localhost/disks/list'
          headers:
            - name: Authorization
              value: 'PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}'
          output_format: JSON
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: raw
        - uuid: 430dbc8869df4f5a9083055812c4c85a
          name: 'PBS: Get snapshots'
          type: SCRIPT
          key: pbs.snapshots
          delay: '{$PBS.SNAPSHOT.INTERVAL}'
          history: 1d
          value_type: TEXT
          params: |
            var params = JSON.parse(value);
            var base = 'https://' + params.host + ':' + params.port + '/api2/json';
            var req = new HttpRequest();
            req.addHeader('Authorization: PBSAPIToken=' + params.token + ':' + params.secret);

            var resp = req.get(encodeURI(base + '/status/datastore-usage'));
            if (req.getStatus() !== 200) {
                throw 'Failed to list datastores: HTTP status ' + req.getStatus();
            }

            var result = [];
            (JSON.parse(resp).data || []).forEach(function (store) {
                if (store.error) {
                    return;
                }
                var snapResp = req.get(encodeURI(base + '/admin/datastore/' + store.store + '/snapshots'));
                if (req.getStatus() !== 200) {
                    Zabbix.log(3, 'PBS snapshot list failed for datastore ' + store.store + ': HTTP status ' + req.getStatus());
                    return;
                }
                var latest = {};
                (JSON.parse(snapResp).data || []).forEach(function (snap) {
                    var group = snap['backup-type'] + '/' + snap['backup-id'];
                    if (!(group in latest) || snap['backup-time'] > latest[group].last) {
                        latest[group] = {
                            type: snap['backup-type'],
                            id: snap['backup-id'],
                            last: snap['backup-time']
                        };
                    }
                });
                Object.keys(latest).forEach(function (group) {
                    result.push({
                        datastore: store.store,
                        group: group,
                        type: latest[group].type,
                        id: latest[group].id,
                        last: latest[group].last
                    });
                });
            });
            return JSON.stringify(result);
          description: |
            Latest snapshot time per backup group, across all datastores.
            The per-datastore snapshot lists are reduced to one entry per backup group
            (the most recent backup-time), so only a small JSON document is stored per
            poll. Datastores that report an error or cannot be queried are skipped;
            their freshness items keep their last known value until the datastore
            recovers (the datastore error trigger covers that condition).
          timeout: 30s
          parameters:
            - name: host
              value: '{$PBS.HOST}'
            - name: port
              value: '{$PBS.PORT}'
            - name: secret
              value: '{$PBS.TOKEN.SECRET}'
            - name: token
              value: '{$PBS.TOKEN.ID}'
          tags:
            - tag: component
              value: raw
        - uuid: 17e7c9ee749946aaaf19ae4f1148f0d1
          name: 'PBS: Get failed tasks'
          type: HTTP_AGENT
          key: pbs.tasks.error
          delay: 5m
          history: 7d
          value_type: TEXT
          description: 'Get erroneuous tasks.'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
              error_handler: CUSTOM_VALUE
              error_handler_params: 'Error getting data'
            - type: JSONPATH
              parameters:
                - $.body.data
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  const daysAgo = {$PBS.TASKS.DAYS};
                  const daysInSeconds = daysAgo * 86400;
                  const currentTimestamp = Math.floor(Date.now() / 1000);
                  const thresholdTimestamp = currentTimestamp - daysInSeconds;

                  tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (task.starttime > thresholdTimestamp) {
                              result.push(task);
                          }
                      });
                  }

                  return JSON.stringify(result);
          timeout: 10s
          url: 'https://{$PBS.HOST}:{$PBS.PORT}/api2/json/nodes/0/tasks'
          query_fields:
            - name: errors
              value: 'true'
            - name: running
              value: 'false'
            - name: statusfilter
              value: error
            - name: statusfilter
              value: warning
          headers:
            - name: Authorization
              value: 'PBSAPIToken={$PBS.TOKEN.ID}:{$PBS.TOKEN.SECRET}'
          output_format: JSON
          verify_peer: 'YES'
          verify_host: 'YES'
          tags:
            - tag: component
              value: raw
        - uuid: 2c1882c1b4ad475e961922283a62ef2a
          name: 'PBS: Failed other tasks'
          type: DEPENDENT
          key: pbs.tasks.error.other
          history: 7d
          value_type: TEXT
          description: 'Failed tasks within the last {$PBS.TASKS.DAYS} days whose worker type is not covered by the per-worktype items (backup, garbage collection, prune, sync, verify).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var prefixes = ['backup', 'garbage_collection', 'prune', 'sync', 'verif'];
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          var type = String(task.worker_type || '');
                          var matched = false;
                          for (var i = 0; i < prefixes.length; i++) {
                              if (type.indexOf(prefixes[i]) === 0) {
                                  matched = true;
                                  break;
                              }
                          }
                          if (!matched) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
          triggers:
            - uuid: c445dde077474ebd95939a71ee703605
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.other)<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.other)="[]"'
              name: 'PBS: Failed tasks found'
              opdata: '{ITEM.VALUE}'
              priority: HIGH
              description: 'Failed tasks occured within the last {$PBS.TASKS.DAYS} days. Catch-all for worker types not covered by the per-worktype triggers (backup, garbage collection, prune, sync, verify).'
              dependencies:
                - name: 'PBS: API service not available'
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
        - uuid: b1e3da2de2ae416393f0ea3cfdd1136b
          name: 'PBS: Failed backup tasks'
          type: DEPENDENT
          key: 'pbs.tasks.error.worktype[backup]'
          history: 7d
          value_type: TEXT
          description: 'Failed backup tasks (worker type prefix "backup") within the last {$PBS.TASKS.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (String(task.worker_type || '').indexOf('backup') === 0) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
            - tag: worktype
              value: backup
          triggers:
            - uuid: ea855b13f3844b65ab0c9cf1839b56dd
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[backup])<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[backup])="[]"'
              name: 'PBS: Failed backup tasks found'
              opdata: '{ITEM.VALUE}'
              priority: HIGH
              description: 'Backup tasks failed within the last {$PBS.TASKS.DAYS} days. A client backup did not complete.'
              dependencies:
                - name: 'PBS: API service not available'
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
        - uuid: 10206f1f7fce424ba918989057915596
          name: 'PBS: Failed garbage collection tasks'
          type: DEPENDENT
          key: 'pbs.tasks.error.worktype[garbage_collection]'
          history: 7d
          value_type: TEXT
          description: 'Failed garbage collection tasks (worker type prefix "garbage_collection") within the last {$PBS.TASKS.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (String(task.worker_type || '').indexOf('garbage_collection') === 0) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
            - tag: worktype
              value: garbage_collection
          triggers:
            - uuid: b70d0d49346348e2be5e947c8a210ac7
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[garbage_collection])<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[garbage_collection])="[]"'
              name: 'PBS: Failed garbage collection tasks found'
              opdata: '{ITEM.VALUE}'
              priority: AVERAGE
              description: 'Garbage collection tasks failed within the last {$PBS.TASKS.DAYS} days. Unused chunks are not being reclaimed.'
              dependencies:
                - name: 'PBS: API service not available'
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
        - uuid: e41476ecb438420ca881d07b0e372264
          name: 'PBS: Failed prune tasks'
          type: DEPENDENT
          key: 'pbs.tasks.error.worktype[prune]'
          history: 7d
          value_type: TEXT
          description: 'Failed prune tasks (worker type prefix "prune", covering manual and scheduled prune jobs) within the last {$PBS.TASKS.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (String(task.worker_type || '').indexOf('prune') === 0) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
            - tag: worktype
              value: prune
          triggers:
            - uuid: 7b410796efa04dbb9a92ea6e67ef802c
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[prune])<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[prune])="[]"'
              name: 'PBS: Failed prune tasks found'
              opdata: '{ITEM.VALUE}'
              priority: AVERAGE
              description: 'Prune tasks failed within the last {$PBS.TASKS.DAYS} days. Old snapshots are not being cleaned up.'
              dependencies:
                - name: 'PBS: API service not available'
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
        - uuid: 564ce70f0e7844bd84c336c0ced22738
          name: 'PBS: Failed sync tasks'
          type: DEPENDENT
          key: 'pbs.tasks.error.worktype[sync]'
          history: 7d
          value_type: TEXT
          description: 'Failed sync tasks (worker type prefix "sync", covering manual syncs and scheduled sync jobs) within the last {$PBS.TASKS.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (String(task.worker_type || '').indexOf('sync') === 0) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
            - tag: worktype
              value: sync
          triggers:
            - uuid: 3f3b78733ec14fc9ae01516f43a7c55e
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[sync])<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[sync])="[]"'
              name: 'PBS: Failed sync tasks found'
              opdata: '{ITEM.VALUE}'
