              tags:
                - tag: component
                  value: storage
                - tag: disk
                  value: '{#DISK.PATH}'
            - uuid: 791a4b27bf53470cad24018548b2439d
              name: 'PBS: Disk [{#DISK.PATH}] Wearout'
              type: DEPENDENT
              key: 'pbs.disk.wearout[{#DISK.PATH}]'
              history: 90d
              value_type: FLOAT
              units: '%'
              description: |
                Disk wearout reported by PBS, as a percentage.
                Note: the direction of this value (whether a higher number means more or
                less wear) is SSD-model dependent and not standardized across vendors.
                The value is discarded for disks that do not report numeric wearout data.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.devpath == ''{#DISK.PATH}'')].wearout.first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var n = parseFloat(value);
                      if (isNaN(n)) {
                          throw 'No numeric wearout data reported for this disk';
                      }
                      return n;
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.disks
              tags:
                - tag: component
                  value: storage
                - tag: disk
                  value: '{#DISK.PATH}'
          master_item:
            key: pbs.disks
          lld_macro_paths:
            - lld_macro: '{#DISK.NAME}'
              path: $.name
            - lld_macro: '{#DISK.PATH}'
              path: $.devpath
            - lld_macro: '{#DISK.SERIAL}'
              path: $.serial
            - lld_macro: '{#DISK.SIZE}'
              path: $.size
            - lld_macro: '{#DISK.STATUS}'
              path: $.status
            - lld_macro: '{#DISK.TYPE}'
              path: '$.[''disk-type'']'
            - lld_macro: '{#DISK.USED}'
              path: $.used
            - lld_macro: '{#DISK.VENDOR}'
              path: $.vendor
            - lld_macro: '{#DISK.WEAROUT}'
              path: $.wearout
          overrides:
            - name: 'No wearout item for disks without numeric wearout'
              step: '1'
              filter:
                conditions:
                  - macro: '{#DISK.WEAROUT}'
                    value: '^[0-9.]+$'
                    operator: NOT_MATCHES_REGEX
              operations:
                - operationobject: ITEM_PROTOTYPE
                  operator: LIKE
                  value: Wearout
                  discover: NO_DISCOVER
      macros:
        - macro: '{$PBS.DATASTORE.AVAILABLE.MIN}'
          value: '10737418240'
          description: 'Minimum available space in a datastore, in bytes (defaults to 10 GiB). Can be overridden per datastore using the {#DATASTORE.NAME} macro context.'
        - macro: '{$PBS.HOST}'
          value: '<SET PBS HOSTNAME>'
          description: 'Hostname or IP address of the PBS server API endpoint. Must be set on the host.'
        - macro: '{$PBS.PORT}'
          value: '8007'
          description: 'The API uses the HTTPS protocol and the server listens on port 8007 by default.'
        - macro: '{$PBS.SNAPSHOT.AGE.HIGH}'
          value: 50h
          description: 'Last-snapshot age of a backup group above which a HIGH severity trigger fires. Default suits a daily backup schedule. Can be overridden per backup group using the {#BACKUP.GROUP} macro context.'
        - macro: '{$PBS.SNAPSHOT.AGE.WARN}'
          value: 30h
          description: 'Last-snapshot age of a backup group above which a WARNING severity trigger fires. Default suits a daily backup schedule. Can be overridden per backup group using the {#BACKUP.GROUP} macro context.'
        - macro: '{$PBS.SNAPSHOT.INTERVAL}'
          value: 15m
          description: 'Polling interval of the snapshot list item. Listing snapshots returns every snapshot of each datastore, so keep this interval moderate.'
        - macro: '{$PBS.TASKS.DAYS}'
          value: '2'
          description: 'Age of tasks to consider when looking for failed tasks (days).'
        - macro: '{$PBS.TOKEN.ID}'
          value: USER@REALM!TOKENID
          description: 'API tokens allow stateless access to most parts of the REST API by another system, software or API client.'
        - macro: '{$PBS.TOKEN.SECRET}'
          type: SECRET_TEXT
          description: 'Secret key of the API token.'
      valuemaps:
        - uuid: b4e066bfeb334388a8fb9f30ad844459
          name: 'HTTP response status code'
          mappings:
            - value: '200'
              newvalue: OK
            - value: '301'
              newvalue: 'Moved Permanently'
            - value: '400'
              newvalue: 'Bad Request'
            - value: '401'
              newvalue: Unauthorized
            - value: '403'
              newvalue: Forbidden
            - value: '404'
              newvalue: 'Not Found'
            - value: '405'
              newvalue: 'Method Not Allowed'
            - value: '500'
              newvalue: 'Internal Server Error'
            - value: '502'
              newvalue: 'Bad Gateway'
            - value: '503'
              newvalue: 'Service Unavailable'
            - value: '504'
              newvalue: 'Gateway Timeout'
            - value: '520'
              newvalue: 'Unknown Error'
