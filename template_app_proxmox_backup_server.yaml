                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
        - uuid: 9608bc608a024b5bb0c6d73ae5e09fab
          name: 'PBS: Failed verify tasks'
          type: DEPENDENT
          key: 'pbs.tasks.error.worktype[verify]'
          history: 7d
          value_type: TEXT
          description: 'Failed verify tasks (worker type prefix "verif", covering manual verification and scheduled verification jobs) within the last {$PBS.TASKS.DAYS} days.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var result = [];
                  var tasks = JSON.parse(value);
                  if (tasks instanceof Array) {
                      tasks.forEach(function (task) {
                          if (String(task.worker_type || '').indexOf('verif') === 0) {
                              result.push(task);
                          }
                      });
                  }
                  return JSON.stringify(result);
          master_item:
            key: pbs.tasks.error
          tags:
            - tag: component
              value: tasks
            - tag: worktype
              value: verify
          triggers:
            - uuid: b90f867121b24a5bb8f37c6cfbdb5fd1
              expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[verify])<>"[]"'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Proxmox Backup Server by HTTP/pbs.tasks.error.worktype[verify])="[]"'
              name: 'PBS: Failed verify tasks found'
              opdata: '{ITEM.VALUE}'
              priority: AVERAGE
              description: 'Verification tasks failed within the last {$PBS.TASKS.DAYS} days. Snapshot integrity is not confirmed.'
              dependencies:
                - name: 'PBS: API service not available'
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
      discovery_rules:
        - uuid: de800b33f3054bb5a49d5e68f4c7851a
          name: 'PBS: Backup group discovery'
          type: DEPENDENT
          key: pbs.backupgroup.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            Discovers the backup groups (backup-type/backup-id, e.g. host/myclient)
            that have at least one snapshot in any datastore.
            Note: a client that has never produced a single snapshot is not
            discovered and therefore not monitored for freshness.
          item_prototypes:
            - uuid: e41c4d860873477a97611b98bb8ca60e
              name: 'PBS: Backup group [{#DATASTORE.NAME}/{#BACKUP.GROUP}] Last Snapshot Age'
              type: DEPENDENT
              key: 'pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.GROUP}]'
              history: 90d
              units: s
              description: |
                Seconds since the most recent snapshot of backup group {#BACKUP.GROUP}
                in datastore {#DATASTORE.NAME}.
                For datastores filled by a sync job the snapshots keep the original
                backup-time of the source, so on the sync target this measures
                end-to-end freshness (client backup plus sync).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.datastore == ''{#DATASTORE.NAME}'' && @.group == ''{#BACKUP.GROUP}'')].last.first()'
                  error_handler: DISCARD_VALUE
                - type: JAVASCRIPT
                  parameters:
                    - 'return Math.max(0, Math.floor(Date.now() / 1000) - value);'
              master_item:
                key: pbs.snapshots
              tags:
                - tag: backup_group
                  value: '{#BACKUP.GROUP}'
                - tag: component
                  value: backup-freshness
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
              trigger_prototypes:
                - uuid: 9d4d36649a1e4728839bcdf313f77e6f
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}'
                  name: 'PBS: Backup group [{#DATASTORE.NAME}/{#BACKUP.GROUP}] last snapshot older than high threshold'
                  priority: HIGH
                  description: 'The most recent snapshot of backup group [{#BACKUP.GROUP}] in datastore [{#DATASTORE.NAME}] is older than {$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}. The client backup job has not produced a new snapshot for an extended period; check the client and its backup schedule.'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
                - uuid: ad372da28008485da184353c2922f644
                  expression: 'last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.WARN:"{#BACKUP.GROUP}"}'
                  name: 'PBS: Backup group [{#DATASTORE.NAME}/{#BACKUP.GROUP}] last snapshot older than warning threshold'
                  priority: WARNING
                  description: 'The most recent snapshot of backup group [{#BACKUP.GROUP}] in datastore [{#DATASTORE.NAME}] is older than {$PBS.SNAPSHOT.AGE.WARN:"{#BACKUP.GROUP}"}. A recent client backup run may have failed or been skipped.'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
                    - name: 'PBS: Backup group [{#DATASTORE.NAME}/{#BACKUP.GROUP}] last snapshot older than high threshold'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.backupgroup.lastsnapshot.age[{#DATASTORE.NAME},{#BACKUP.GROUP}])>{$PBS.SNAPSHOT.AGE.HIGH:"{#BACKUP.GROUP}"}'
          master_item:
            key: pbs.snapshots
          lld_macro_paths:
            - lld_macro: '{#BACKUP.GROUP}'
              path: $.group
            - lld_macro: '{#BACKUP.ID}'
              path: $.id
            - lld_macro: '{#BACKUP.TYPE}'
              path: $.type
            - lld_macro: '{#DATASTORE.NAME}'
              path: $.datastore
        - uuid: 5eec729d0e1c4e529cdc884a6c5887db
          name: 'PBS: Datastore discovery'
          type: DEPENDENT
          key: pbs.datastore.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers the datastores configured on the Proxmox Backup Server from the datastore-usage endpoint.'
          item_prototypes:
            - uuid: 60f2c0498c414dfdab7e80cc7ea2985b
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Available Size'
              type: DEPENDENT
              key: 'pbs.datastore.available[{#DATASTORE.NAME}]'
              history: 90d
              units: bytes
              description: 'Available size of datastore in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].avail.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
              trigger_prototypes:
                - uuid: 79b3b6148288487f86d596ffdce93434
                  expression: |
                    min(/Proxmox Backup Server by HTTP/pbs.datastore.available[{#DATASTORE.NAME}],15m)<
                    {$PBS.DATASTORE.AVAILABLE.MIN:"{#DATASTORE.NAME}"}
                  name: 'PBS: Datastore [{#DATASTORE.NAME}] Available Size'
                  priority: HIGH
                  description: 'Datastore [{#DATASTORE.NAME}] has less than {$PBS.DATASTORE.AVAILABLE.MIN:"{#DATASTORE.NAME}"} bytes available.'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
            - uuid: 75d30b86c1234fb08f90b5f6cbe958af
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Error'
              type: DEPENDENT
              key: 'pbs.datastore.error[{#DATASTORE.NAME}]'
              history: 90d
              value_type: TEXT
              description: 'Error status of datastore.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].error.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'No Error'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
              trigger_prototypes:
                - uuid: b9adc2dcab1f417ea18bcbfceadfb725
                  expression: 'find(/Proxmox Backup Server by HTTP/pbs.datastore.error[{#DATASTORE.NAME}],,"like","No Error")=0'
                  name: 'PBS: Datastore [{#DATASTORE.NAME}] Error'
                  priority: HIGH
                  description: 'Datastore [{#DATASTORE.NAME}] is reporting an error!'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
            - uuid: a75f614f0bfa43b6b2c6d70456098dad
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Full Date'
              type: DEPENDENT
              key: 'pbs.datastore.estimatedfulldate[{#DATASTORE.NAME}]'
              history: 90d
              value_type: TEXT
              description: |
                Estimation of the Date Time Stamp when the storage will be full.
                It's calculated via a simple Linear Regression (Least Squares) over the RRD data of the
                last Month. Missing if not enough data points are available yet. An estimate in the past
                means that usage is declining or not changing.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].[''estimated-full-date''].first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var current_unixtime = Math.floor(Date.now() / 1000);
                      var delta = value - current_unixtime;
                      if (delta < 0) return "Never";
                      return new Date(value * 1000);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
            - uuid: 1bb5ff8c93604d188b85e91006e3987f
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Seconds to Full'
              type: DEPENDENT
              key: 'pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}]'
              history: 90d
              units: s
              description: |
                Estimated number of seconds until the datastore is full.
                It's calculated via a simple Linear Regression (Least Squares) over the RRD data of the
                last Month. Missing if not enough data points are available yet. An estimate in the past
                means that usage is declining or not changing.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].[''estimated-full-date''].first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var current_unixtime = Math.floor(Date.now() / 1000);
                      var delta = Math.max(0, (value - current_unixtime));
                      return delta;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
              trigger_prototypes:
                - uuid: 48c8a3296a0d49e5b000646527a9906d
                  expression: 'max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<2419200 and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0'
                  name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one month'
                  priority: WARNING
                  description: 'Datastore [{#DATASTORE.NAME}] is projected to fill within one month.'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
                    - name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one week'
                      expression: 'max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<604800 and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0'
                - uuid: f8899123a86144a0a306a77143c681cb
                  expression: 'max(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)<604800 and min(/Proxmox Backup Server by HTTP/pbs.datastore.estimatedsecondstofull[{#DATASTORE.NAME}],15m)>0'
                  name: 'PBS: Datastore [{#DATASTORE.NAME}] filling up within one week'
                  priority: HIGH
                  description: 'Datastore [{#DATASTORE.NAME}] is projected to fill within one week.'
                  dependencies:
                    - name: 'PBS: API service not available'
                      expression: 'last(/Proxmox Backup Server by HTTP/pbs.api.available)<>200'
            - uuid: 980e2da86ba74e5c9ca85b1ac308352d
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Estimated Time to Full'
              type: DEPENDENT
              key: 'pbs.datastore.estimatedtimetofull[{#DATASTORE.NAME}]'
              history: 90d
              value_type: TEXT
              description: |
                Estimation of the Time until the storage will be full.
                It's calculated via a simple Linear Regression (Least Squares) over the RRD data of the
                last Month. Missing if not enough data points are available yet. An estimate in the past
                means that usage is declining or not changing.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].[''estimated-full-date''].first()'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var current_unixtime = Math.floor(Date.now() / 1000);
                      var delta = value - current_unixtime;
                      if (delta < 0) return "Never";

                      var days = Math.floor(delta / 86400);
                      delta -= days * 86400;

                      var hours = Math.floor(delta / 3600) % 24;
                      delta -= hours * 3600;

                      var minutes = Math.floor(delta / 60) % 60;
                      delta -= minutes * 60;

                      var seconds = Math.floor(delta % 60);

                      return days+" Days "+hours+":"+minutes+":"+seconds+" (Hours:Minutes:Seconds)";
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
            - uuid: ba568908143c4e87873dd1dd1b733283
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Total Size'
              type: DEPENDENT
              key: 'pbs.datastore.total[{#DATASTORE.NAME}]'
              history: 90d
              units: bytes
              description: 'Total size of datastore in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].total.first()'
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
            - uuid: 5839a1a69f48430cb580bb111486663f
              name: 'PBS: Datastore [{#DATASTORE.NAME}] Used Size'
              type: DEPENDENT
              key: 'pbs.datastore.used[{#DATASTORE.NAME}]'
              history: 90d
              units: bytes
              description: 'Used size of datastore in bytes.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[?(@.store == ''{#DATASTORE.NAME}'')].used.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: pbs.datastore.status
              tags:
                - tag: component
                  value: storage
                - tag: datastore
                  value: '{#DATASTORE.NAME}'
          master_item:
            key: pbs.datastore.status
          lld_macro_paths:
            - lld_macro: '{#DATASTORE.NAME}'
              path: $.store
        - uuid: 4333aa3a0ee64fe8aede5e835d63923d
          name: 'PBS: Disk discovery'
          type: DEPENDENT
          key: pbs.disk.discovery
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discovers the physical disks reported by the Proxmox Backup Server node from the disk list endpoint.'
          item_prototypes:
            - uuid: 85501120e36d48589a52d56d0dec55d7
              name: 'PBS: Disk [{#DISK.PATH}] Model'
              type: DEPENDENT
              key: 'pbs.disk.model[{#DISK.PATH}]'
              history: 90d
              value_type: TEXT
              description: 'Model of the disk.'
              preprocessing:
                - type: JSONPATH
