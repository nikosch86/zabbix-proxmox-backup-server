                - uuid: 0ebb109edcbc40d095945ca9a530dc5f
                  expression: 'find(/Proxmox Backup Server by HTTP/pbs.disk.status[{#DISK.PATH}],,"like","failed")=1'
                  name: 'PBS: Disk [{#DISK.PATH}] Status indicates a problem'
                  priority: WARNING
